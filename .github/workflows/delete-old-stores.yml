name: Delete stores before 2026

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '対象件数だけ確認する（削除しない）'
        required: true
        type: boolean
        default: true
      confirmation:
        description: '削除実行時は DELETE_BEFORE_2026 と入力'
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-old-stores:
    name: Delete stores linked to events before 2026
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Delete old stores
        run: node scripts/delete-stores-before-year.mjs
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirmation }}
